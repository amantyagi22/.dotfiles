# ~/.tmux.conf - Minimal tmux configuration

# Change prefix from Ctrl-b to Ctrl-a (easier to reach)
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# Enable mouse support
set -g mouse on

# Start windows and panes at 1, not 0
set -g base-index 1
setw -g pane-base-index 1

# Renumber windows when one is closed
set -g renumber-windows on

# Increase scrollback buffer size
set -g history-limit 10000

# Enable true color support
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*256col*:Tc"

# Split panes using | and - (more intuitive)
unbind '"'
unbind %
bind | split-window -h
bind - split-window -v

# Reload config file with prefix + r
bind r source-file ~/.tmux.conf \; display "Config reloaded!"

# Switch panes using Alt-arrow without prefix
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

# Vi mode for copy mode
setw -g mode-keys vi

# Theme (managed by ~/.local/bin/theme switcher)
source-file ~/.config/tmux/current-theme.conf

# Switch panes using Ctrl-h/j/k/l (no prefix)
bind -n C-h select-pane -L
bind -n C-j select-pane -D
bind -n C-k select-pane -U
bind -n C-l select-pane -R

# fix broken line
bind m resize-pane -Z

# session navigation
bind-key N switch-client -n
bind-key P switch-client -p

# fzf session switch
unbind s
bind s display-popup -E "tmux list-sessions -F '#S' | fzf | xargs -r tmux switch-client -t"
